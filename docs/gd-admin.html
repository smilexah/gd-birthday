<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INKAR · Админка поздравлений</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#F1F4FB;color:#12233F}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 100%,rgba(232,178,94,.3),rgba(232,178,94,0) 55%),linear-gradient(180deg,#071238,#0B1F5C 60%,#14337F)}
.lbox{background:#fff;border-radius:24px;padding:34px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.lbox h1{margin:14px 0 6px;font-size:26px;font-weight:900;color:#0B1F5C}
.lbox p{margin:0 0 20px;color:#5B6577;font-weight:600}
.fld{display:block;width:100%;border:2px solid #D8E0F5;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:700;color:#12233F;margin-bottom:12px;background:#fff}
.fld:focus{outline:none;border-color:#2457F5}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px}
.gold{background:linear-gradient(#FFE9A8,#E8B25E);color:#3B2300;border-bottom:3px solid #A6732F}
.blue{background:#2457F5;color:#fff;border-bottom:3px solid #162F8C}
.ghost{background:#EEF1FF;color:#1C3A8F}
.danger{background:#FFE3E8;color:#B3123F}
.err{color:#C22C66;font-weight:800;min-height:20px;margin-bottom:8px}
#app{display:none;min-height:100vh}
aside{position:fixed;left:0;top:0;bottom:0;width:240px;background:linear-gradient(180deg,#0B1F5C,#071238);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
aside .logo{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:18px}
aside .logo img{height:34px;display:block}
.nav{display:flex;align-items:center;gap:12px;background:none;border:0;color:#C9D6FF;text-align:left;padding:12px 14px;border-radius:12px;font-weight:800;font-size:15px}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:linear-gradient(#FFE9A8,#E8B25E);color:#3B2300}
.nav .bd{margin-left:auto;background:#E8286A;color:#fff;border-radius:999px;font-size:12px;padding:2px 8px}
.sp{flex:1}
main{margin-left:240px;padding:28px 32px 60px;max-width:1280px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.top h2{margin:0;font-size:30px;font-weight:900;color:#0B1F5C}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 0 rgba(11,31,92,.04),0 10px 26px rgba(11,31,92,.07)}
.stat .n{font-size:38px;font-weight:900;color:#0B1F5C;line-height:1.1}
.stat .l{font-weight:800;color:#5B6577;font-size:14px}
.stat.g .n{color:#B9802F}
.stat.r .n{color:#C22C66}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:17px;font-weight:900;color:#0B1F5C}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800;font-size:14px}
.bar .nm{width:140px;color:#33415F}
.bar .tr{flex:1;background:#EEF1FF;border-radius:999px;height:16px;overflow:hidden}
.bar .fl{height:100%;border-radius:999px;background:linear-gradient(90deg,#2457F5,#6A8CFF)}
.bar .v{width:40px;text-align:right;color:#0B1F5C}
.days{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-weight:800;font-size:13px;color:#33415F}
.days .col{width:100%;max-width:60px;border-radius:10px 10px 0 0;background:linear-gradient(#FFE9A8,#E8B25E)}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:900}
.s-vis{background:#D9F6E8;color:#0F6B43}
.s-hid{background:#FFE7A8;color:#7A4B0B}
.p-open{background:#D9F6E8;color:#0F6B43}
.p-closed{background:#FFE3E8;color:#B3123F}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tools .fld{margin:0;width:auto;flex:1;min-width:180px;padding:10px 14px;font-size:15px}
.tools select.fld{flex:0 0 auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:#5B6577;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 10px;border-bottom:2px solid #EEF1FF}
td{padding:12px 10px;border-bottom:1px solid #EEF1FF;vertical-align:top;font-weight:600}
td.tx{max-width:380px;color:#33415F}
td .nm{font-weight:900;color:#0B1F5C}
td .pl{color:#5B6577;font-size:12px;font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:7px 12px;font-size:12px}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px;font-weight:800;color:#5B6577}
.cmp{display:flex;flex-direction:column;gap:12px}
.ci{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ci .bx{flex:1;min-width:240px}
.cnt{background:#E8286A;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900;margin-left:8px}
.empty{text-align:center;color:#5B6577;font-weight:800;padding:40px 0}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid #EEF1FF}
.set:last-child{border:0}
.set b{display:block;font-size:16px;color:#0B1F5C}
.set span{color:#5B6577;font-weight:600;font-size:14px}
.sw{width:58px;height:32px;border-radius:999px;background:#C4CCE4;border:0;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sw.on{background:#22B573}
.sw.on:after{left:30px}
#show{display:none;position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 100%,rgba(232,178,94,.35),rgba(232,178,94,0) 55%),linear-gradient(180deg,#071238,#0B1F5C 60%,#14337F);color:#fff;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#show .q{max-width:900px;font-size:34px;line-height:1.45;font-weight:800}
#show .who{margin-top:26px;font-size:30px;font-weight:900;color:#F2C45E}
#show .pl{margin-top:8px;font-size:18px;font-weight:700;color:#C9D6FF}
#show .hd{position:absolute;top:22px;left:0;right:0;font-size:22px;font-weight:900;color:#F2C45E}
#show .ct{position:absolute;bottom:26px;left:0;right:0;font-weight:800;color:#C9D6FF}
#show .x{position:absolute;top:18px;right:22px}
#show .nv{position:absolute;top:50%;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(#FFF0C2,#E8B25E);font-size:26px;font-weight:900;color:#3B2300}
#show .pr{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#F2C45E,#FFE9A8)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#0B1F5C;color:#fff;font-weight:800;padding:13px 24px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:200}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){
aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}
aside .logo{margin:0 8px 0 0}
.sp{display:none}
main{margin-left:0;padding:18px 14px 50px}
.grid4{grid-template-columns:repeat(2,1fr)}
.cols{grid-template-columns:1fr}
#show .q{font-size:22px}
#show .who{font-size:22px}
.bar .nm{width:100px}
}
</style>
</head>
