<style>
body{margin:0}
button{font-family:inherit}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 3s ease-out infinite;opacity:0}
.bs1{animation-delay:0s}.bs2{animation-delay:.7s}.bs3{animation-delay:1.4s}.bs4{animation-delay:2.1s}.bs5{animation-delay:1s}.bs6{animation-delay:1.8s}
@keyframes burst{0%{transform:scale(0.1);opacity:0}15%{opacity:1}65%{opacity:0.95}100%{transform:scale(1.3);opacity:0}}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flick 0.8s ease-in-out infinite}
.fl2{animation-delay:.2s}.fl3{animation-delay:.45s}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(0.86,1.22)}}
.float{animation:floaty 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
.f2{animation-duration:6s;animation-delay:-1s}.f3{animation-duration:4.5s;animation-delay:-2s}.f4{animation-duration:5.5s;animation-delay:-3s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-20px) rotate(3deg)}}
.fall{animation:fall 8s linear infinite}
.fa2{animation-duration:10s}.fa3{animation-duration:6.5s}.fa4{animation-duration:12s}
@keyframes fall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(980px) rotate(720deg)}}
.sway{transform-box:fill-box;transform-origin:center top;animation:sway 3.2s ease-in-out infinite}
.sw2{animation-delay:-1.1s}.sw3{animation-delay:-2.2s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.tw2{animation-delay:.6s}.tw3{animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.6) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.cta{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(255,200,90,0.7),0 8px 0 #A6732F,0 0 0 0 rgba(255,214,120,0.7)}50%{box-shadow:0 0 50px rgba(255,200,90,0.9),0 8px 0 #A6732F,0 0 0 20px rgba(255,214,120,0)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.b2{animation-delay:-.8s}.b3{animation-delay:-1.6s}.b4{animation-delay:-2.4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.p2{animation-delay:.12s}.p3{animation-delay:.24s}.p4{animation-delay:.36s}
@keyframes pop{0%{transform:translateY(-40px) scale(0.8);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.s3d{transition:transform .3s ease;transform-style:preserve-3d}
.s3d:hover{transform:perspective(500px) rotateY(-16deg) rotateX(8deg) scale(1.1)}
.r1{transform:rotate(-1.6deg)}.r2{transform:rotate(1.3deg)}.r3{transform:rotate(-0.8deg)}.r4{transform:rotate(1.8deg)}
.track{animation:marq 90s linear infinite}
.marq:hover .track{animation-play-state:paused}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.marq{overflow-x:auto}}
.shine{background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tag{display:inline-block;align-self:flex-start;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800}
.t-apt{background:#FFD3DE;color:#8A1F42}
.t-fil{background:#BDF1E6;color:#0F5547}
.t-off{background:#CFDBFF;color:#1C3A8F}
.t-log{background:#FFE7A8;color:#7A4B0B}
.t-reg{background:#E6D2FF;color:#4F2A8A}
</style>
